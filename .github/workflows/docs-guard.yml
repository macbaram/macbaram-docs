name: Public documentation guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate public facts and documentation boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/validate_public_docs.py --check-live-sources
